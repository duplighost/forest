<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe3a0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Glide</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%BF%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: light; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #cfe8b4;
        font-family: system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      /* Wordless loading veil: a soft sun that breathes, then fades. */
      #veil {
        position: fixed; inset: 0; z-index: 10;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(120% 120% at 50% 35%, #f7f1cf 0%, #d7ecae 45%, #a9d189 100%);
        transition: opacity 1.2s ease;
      }
      #veil.hidden { opacity: 0; pointer-events: none; }
      #veil .orb {
        width: 64px; height: 64px; border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #fff6d8, #ffd980 60%, #f4b24a 100%);
        box-shadow: 0 0 40px 14px rgba(255, 214, 130, 0.7);
        animation: breathe 2.4s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(0.82); opacity: 0.78; }
        50%      { transform: scale(1.12); opacity: 1; }
      }
      /* Subtle hint glyphs for first-time players (no text). Fade away on first input. */
      #hint {
        position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
        z-index: 9; display: flex; gap: 22px; align-items: center;
        opacity: 0; transition: opacity 1s ease; pointer-events: none;
        filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
      }
      #hint.show { opacity: 0.9; }
      #hint.gone { opacity: 0 !important; }
      #hint svg { width: 46px; height: 46px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="veil"><div class="orb"></div></div>
    <div id="hint">
      <!-- WASD glyph -->
      <svg viewBox="0 0 120 80" fill="none">
        <g fill="rgba(255,255,255,0.92)" stroke="rgba(0,0,0,0.25)" stroke-width="2">
          <rect x="44" y="4"  width="32" height="32" rx="6"/>
          <rect x="4"  y="44" width="32" height="32" rx="6"/>
          <rect x="44" y="44" width="32" height="32" rx="6"/>
          <rect x="84" y="44" width="32" height="32" rx="6"/>
        </g>
        <g fill="rgba(80,90,70,0.9)">
          <path d="M60 14l7 9h-14z"/>
          <path d="M20 54l7 9h-14z" transform="rotate(-90 20 60)"/>
          <path d="M60 54l7 9h-14z" transform="rotate(180 60 60)"/>
          <path d="M100 54l7 9h-14z" transform="rotate(90 100 60)"/>
        </g>
      </svg>
      <!-- mouse glyph -->
      <svg viewBox="0 0 60 80" fill="none">
        <rect x="14" y="6" width="32" height="50" rx="16" fill="rgba(255,255,255,0.92)" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>
        <line x1="30" y1="10" x2="30" y2="26" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>
        <path d="M30 64 q-10 6 -16 12 M30 64 q10 6 16 12" stroke="rgba(255,255,255,0.85)" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
